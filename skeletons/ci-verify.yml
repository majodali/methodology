# Skeleton CI verify workflow (methodology practice D3: CI on every PR —
# typecheck + build/synth + unit tests; no AWS credentials in the PR
# path). Copy to .github/workflows/verify.yml and adapt the commands to
# the project's own verification ladder (practices §2.C).
name: verify

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      # Deployable projects add synthesis verification (rung C3), e.g.:
      # - run: npx cdk synth
